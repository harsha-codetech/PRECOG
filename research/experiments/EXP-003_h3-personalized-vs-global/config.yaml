experiment: EXP-003
hypothesis: >
  H3 — at matched sensitivity, a personalized baseline produces a lower false-positive rate
  than a global (population) threshold. This is PRECOG's central claim: "60 minutes is
  normal for me but not for you."

input: data/processed/hmog_gesture-features_features-v0.1.parquet
feature_version: features-v0.1
baseline_version: baseline-v0.1
seed: 42

# ---------------------------------------------------------------------------
# Labels do not exist. No public dataset pairs scroll telemetry with compulsive-use
# labels, so anomalies are INJECTED into real held-out gestures.
#
# Negatives (must not alert) are genuine, untouched user gestures.
# Positives (should alert)  are real gestures with a controlled behavioural shift applied.
#
# The shift is scaled by the POPULATION MAD, not the user's own — the same physical
# change is applied to everyone. Scaling by personal spread would bake personalization
# into the definition of the anomaly and rig the comparison.
#
# This is a semi-synthetic design and must be reported as such. It tests the DETECTOR,
# not the clinical reality of compulsive scrolling.
# ---------------------------------------------------------------------------
perturbation:
  # "Faster, more repetitive scrolling with shorter pauses" — direction in population MADs.
  direction:
    average_velocity: +1.0
    velocity_p50: +1.0
    velocity_p80: +1.0
    inter_scroll_ms: -1.0
    duration_ms: -0.5
  severities: [0.5, 1.0, 1.5, 2.0, 3.0]
  positive_fraction: 0.5

split:
  enrol_gestures: 80        # from EXP-002: median subject converges at n=80
  min_holdout: 40

evaluation:
  target_sensitivity: 0.80  # FPR is compared at matched TPR
  min_subjects: 30

statistics:
  # Paired per-subject comparison, non-normal -> Wilcoxon signed-rank.
  test: wilcoxon
  effect_size: cliffs_delta
  bootstrap_iterations: 2000
